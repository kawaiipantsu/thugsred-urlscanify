# THUGSred Urlscanify - Apache config (enabled as conf-available/urlscanify.conf).
ServerName urlscanify

<Directory /var/www/urlscanify/public>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

# Only public/ is served; lib/ sits outside the document root.
<DirectoryMatch "^/var/www/urlscanify/(?!public)">
    Require all denied
</DirectoryMatch>

# The page is private tooling: never index it, never leak the scope
# (domain / person in the URL) to the search engines it links to.
Header always set X-Robots-Tag "noindex, nofollow"
Header always set Referrer-Policy "no-referrer"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Strict CSP for the page itself. Not applied to the SVGs, which carry their own
# <style> for the mascot animation.
Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" "expr=%{CONTENT_TYPE} =~ m#^text/html#"

<FilesMatch "\.(woff2|svg)$">
    Header set Cache-Control "public, max-age=2592000"
</FilesMatch>
<FilesMatch "\.(css|js)$">
    # URLs carry ?v=<version>, so a release always busts the cache.
    Header set Cache-Control "public, max-age=604800"
</FilesMatch>
